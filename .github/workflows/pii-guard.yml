name: pii-guard
on:
  # ready_for_review is listed so the required check reports when a draft is
  # marked ready, as ci.yml does.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main, beta]
permissions:
  contents: read
jobs:
  pii-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Block personal info
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            python3 scripts/pii-guard/pii_guard.py "origin/${{ github.base_ref }}"
          else
            python3 scripts/pii-guard/pii_guard.py
          fi
