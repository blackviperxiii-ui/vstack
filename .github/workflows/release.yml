name: Release

# Publishes vstack-<VERSION> as a GitHub Release with tarball, zip, and
# SHA256SUMS. Run it from main (Actions, Release, Run workflow), or push a
# v<VERSION> tag. VERSION, both plugin.json files, and the tag must agree.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION $version" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Run releases from main, not ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Fail if the release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.version.outputs.version }} already exists; bump VERSION first" >&2
            exit 1
          fi
      - run: python scripts/lint_skills.py
      - run: python scripts/check_secrets.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -q
      - run: scripts/package_release.sh
      - name: Extract release notes
        run: |
          awk -v v="## ${{ steps.version.outputs.version }}" \
            '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > dist/NOTES.md
          test -s dist/NOTES.md || { echo "CHANGELOG.md has no section for this version" >&2; exit 1; }
          cat >> dist/NOTES.md <<'NOTES'

          ## Install

          - Cursor: `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash`
          - Claude Code: `/plugin marketplace add ${{ github.repository }}` then `/plugin install vstack@vstack`, or the installer with `--target claude`
          - Other agents: `npx skills add ${{ github.repository }}`
          NOTES
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          gh release create "v$v" \
            dist/vstack-$v.tar.gz dist/vstack-$v.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "vstack $v" \
            --notes-file dist/NOTES.md \
            --latest
