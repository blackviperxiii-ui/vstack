name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  merge_group:
  # Nightly full run (3:25 AM Central during CDT).
  schedule:
    - cron: "25 8 * * *"

permissions:
  contents: read
  pull-requests: read

# A newer push to the same PR or to beta cancels the run it replaces; only the
# newest beta commit needs a result. The group includes the event, so a push
# never cancels a manual or nightly run. Pushes to main always finish.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/beta') }}

# PRs run lint (skill lint, secret check, unit tests) and token-check (a
# freshness check on tokens.json plus a size report, with no size limits). Each is
# gated by a job-level `if:` on the `changes` output, never a workflow-level
# path filter, so a skipped required check still reports as passed. Push,
# manual and merge_group runs always run both; the nightly runs both unless
# its commit already passed CI. See docs/ci-policy.md.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.nightly.outputs.passed != 'true' && (github.event_name != 'pull_request' || steps.filter.outputs.code == 'true') }}
      tokens: ${{ steps.nightly.outputs.passed != 'true' && (github.event_name != 'pull_request' || steps.filter.outputs.tokens == 'true') }}
    steps:
      # A nightly on a commit that already passed a push, nightly or manual CI
      # run would only repeat it. If the lookup fails, the nightly runs.
      - name: Skip nightly if this commit already passed
        id: nightly
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=50" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "schedule" or .event == "workflow_dispatch")] | length' 2>/dev/null) || passed=0
          case "$passed" in ''|*[!0-9]*) passed=0 ;; esac
          if [ "$passed" -gt 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "${GITHUB_SHA} already passed CI; skipping the nightly rerun."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!assets/**'
              - '!README.md'
            tokens:
              - '**'
              - '!docs/**'
              - '!assets/**'
              - '!README.md'
              - '!tests/**'

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/lint_skills.py
      - run: python scripts/check_secrets.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -q

  token-check:
    name: token-check
    needs: changes
    if: needs.changes.outputs.tokens == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # No pip cache: the install is one small wheel set (~2 s), while a
      # cache restore can stall for 10 min when the cache service refuses it.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      # Fails only on a stale tokens.json. The per-skill delta table in the
      # job summary is informational; skill size is never capped.
      - run: python scripts/token_check.py
