name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
  merge_group:
  # Nightly full run (3:25 AM Central during CDT).
  schedule:
    - cron: "25 8 * * *"

permissions:
  contents: read
  pull-requests: read

# A newer push to the same PR or to beta cancels the run it replaces; only the
# newest beta commit needs a result. The group includes the event, so a push
# never cancels a manual or nightly run. Pushes to main always finish.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/beta') }}

# PRs run lint (skill lint, secret check, unit tests) and token-check. Each is
# gated by a job-level `if:` on the `changes` output, never a workflow-level
# path filter, so a skipped required check still reports as passed. Push,
# nightly, manual and merge_group runs always run both.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      tokens: ${{ github.event_name != 'pull_request' || steps.filter.outputs.tokens == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!assets/**'
              - '!README.md'
            tokens:
              - '**'
              - '!docs/**'
              - '!assets/**'
              - '!README.md'
              - '!tests/**'

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/lint_skills.py
      - run: python scripts/check_secrets.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -q

  token-check:
    name: token-check
    needs: changes
    if: needs.changes.outputs.tokens == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # No pip cache: the install is one small wheel set (~2 s), while a
      # cache restore can stall for 10 min when the cache service refuses it.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      # The token lets push runs read the merged PR's labels.
      - run: python scripts/token_check.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
